# ===================================================================
# Smita Dental Clinic & Implant Centre - Application Configuration
# Enterprise Spring Boot Application Properties
# ===================================================================

# Cloud hosts tell the app which port to use through the PORT variable
server.port=${PORT:8080}
spring.application.name=SmitaDentalClinicBackend

# ===== MySQL Database Configuration =====
# The database "dentalclinicdb" is created automatically if it does not exist.
# >>> CHANGE the password below to YOUR MySQL root password (or set env vars DB_USERNAME / DB_PASSWORD) <<<
# On a cloud host set the DB_URL environment variable to the database address (see DEPLOYMENT.md)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dentalclinicdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_mysql_password}

# JPA & Hibernate Settings (Hibernate creates / updates all tables from the @Entity classes)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tables come from the @Entity classes, so do not auto-run schema.sql (it is a reference script only)
spring.sql.init.mode=never

# Want the old zero-setup in-memory H2 database instead of MySQL?
# Run with the "h2" profile:  mvn spring-boot:run -Dspring-boot.run.profiles=h2

# Swagger / OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# CORS Settings for Frontend Integration
clinic.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000

# ===== Security =====
# JWT signing secret (min 32 chars). Set the JWT_SECRET environment variable in any real deployment.
clinic.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
clinic.jwt.expiration-minutes=480
